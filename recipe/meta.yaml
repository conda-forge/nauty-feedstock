{% set version = "2.9.3" %}
{% set name = "nauty" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pallini.di.uniroma1.it/nauty{{ version.replace('.', '_') }}.tar.gz
  sha256: 9fc4edae04f88a0f5883985be3b39cf7f898fd6cc96e96b9ee25452743cc1b5b
  patches:
    - popcount.patch
    - 0001-Add-missing-header-for-isatty-on-Windows.patch  # [win]
    - 0002-Fix-BitScanReverse-misuse-in-MSVC-FIRSTBITNZ.patch  # [win]
    - 0003-Guard-unistd.h-in-POSIX-declaration-checks.patch  # [win]
    - 0004-Use-OBJEXT-for-object-file-names.patch  # [win]
    - 0001-Disable-runtime-checks-when-cross-compiling.patch  # [build_platform != target_platform]

build:
  number: 1

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - autoconf              # [unix]
    - automake              # [unix]
    - libtool               # [unix]
    - make                  # [unix]
    - autotools_clang_conda  # [win]

test:
  commands:
    - addedgeg -help
    - test -f $PREFIX/include/nauty/nauty.h                 # [unix]
    - if not exist %LIBRARY_INC%/nauty/nauty.h exit 1       # [win]
    - test -f $PREFIX/include/nauty/traces.h                # [unix]
    - if not exist %LIBRARY_INC%/nauty/traces.h exit 1      # [win]
    - test -f $PREFIX/include/nauty/nausparse.h             # [unix]
    - if not exist %LIBRARY_INC%/nauty/nausparse.h exit 1   # [win]
    - test -f $PREFIX/lib/libnauty.a                        # [unix]
    - if not exist %LIBRARY_LIB%/nauty.lib exit 1           # [win]

about:
  home: https://pallini.di.uniroma1.it/
  doc_url: https://pallini.di.uniroma1.it/Guide.html
  license: Apache-2.0
  license_file: COPYRIGHT
  summary: nauty and Traces are programs for computing automorphism groups of graphs and digraphs.

extra:
  recipe-maintainers:
    - isuruf
    - saraedum
