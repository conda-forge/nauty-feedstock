schema_version: 1

context:
  version: "2.9.3"
  name: nauty

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pallini.di.uniroma1.it/nauty${{ version | replace('.', '_') }}.tar.gz
  sha256: 9fc4edae04f88a0f5883985be3b39cf7f898fd6cc96e96b9ee25452743cc1b5b
  patches:
    - 0001-Include-io.h-from-nauty.h-when-configure-finds-it.patch
    - 0002-Drop-support-for-pre-1989-compilers.patch
    - 0003-Fix-segfault-in-msc_bsr_.patch
    - 0004-Only-include-unistd.h-if-it-exists.patch
    - 0005-Use-OBJEXT-for-object-file-names.patch
    - 0006-Trust-configure-for-128-bit-types-and-popcount-under.patch
    - 0007-Only-use-popcnt-on-Windows-if-it-is-available.patch
    - 0008-Trust-the-sizes-that-configure-measured-for-128-bit-.patch
    - 0009-Skip-shortg-test-when-configure-decided-not-to-build.patch
    - 0010-Install-with-libtool.patch
    - if: build_platform != target_platform
      then: 0011-Disable-runtime-checks-when-cross-compiling.patch

build:
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: unix
      then:
        - autoconf
        - automake
        - libtool
        - make
    - if: win
      then: autotools_clang_conda

tests:
  - script:
      - addedgeg -help
      - if: unix
        then:
          - test -f $PREFIX/include/nauty/nauty.h
          - test -f $PREFIX/include/nauty/traces.h
          - test -f $PREFIX/include/nauty/nausparse.h
          - test -f $PREFIX/lib/libnauty.a
      - if: win
        then:
          - if not exist %LIBRARY_INC%/nauty/nauty.h exit 1
          - if not exist %LIBRARY_INC%/nauty/traces.h exit 1
          - if not exist %LIBRARY_INC%/nauty/nausparse.h exit 1
          - if not exist %LIBRARY_LIB%/nauty.lib exit 1

about:
  license: Apache-2.0
  license_file: COPYRIGHT
  summary: nauty and Traces are programs for computing automorphism groups of graphs and digraphs.
  homepage: https://pallini.di.uniroma1.it/
  documentation: https://pallini.di.uniroma1.it/Guide.html

extra:
  recipe-maintainers:
    - isuruf
    - saraedum
